[package]
name = "ibis-commands"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
description = "Pure command builder and headless agent binding"
license = "MIT"
readme = "README.md"
keywords = ["terminal", "command", "controller"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
glob = "0.3"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[[bin]]
name = "ibis-commands-ctl"
path = "src/bin/ibis-commands-ctl.rs"

[workspace]
resolver = "3"
members = ["."]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
repository = "https://github.com/magnus-encoded/tehuti"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_results = "warn"
let_underscore_drop = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
float_arithmetic = "warn"
exit = "deny"
mem_forget = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_in_result = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
wildcard_enum_match_arm = "deny"
shadow_unrelated = "deny"
missing_assert_message = "deny"
empty_structs_with_brackets = "deny"
rc_mutex = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
std_instead_of_core = "warn"
tests_outside_test_module = "deny"
min_ident_chars = "deny"
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"

