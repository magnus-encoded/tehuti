[package]
name = "tehuti"
version = "0.0.0"
description = "Tehuti compositor: the Smithay edge around the core step"
edition.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
signal-hook = "0.3"
serde_json = "1"
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"
evdev = "0.13"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_drm", "backend_udev", "backend_session_libseat", "renderer_pixman", "wayland_frontend", "desktop", "renderer_gl"] }
tehuti-core = { path = "../core" }
tehuti-protocol = { path = "../protocol" }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3"
proptest = "1"
tehuti-protocol = { path = "../protocol", features = ["arbitrary"] }
toml = "1.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
