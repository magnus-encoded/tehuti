[package]
name = "tehuti"
version = "0.0.0"
description = "Tehuti compositor: the Smithay edge around the core step"
edition.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
fontdue = { version = "0.9", default-features = false, features = ["std"] }
signal-hook = "0.3"
serde_json = "1"
toml = "1.1"
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"
evdev = "0.13"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_libinput", "backend_drm", "backend_gbm", "renderer_multi", "use_system_lib", "backend_udev", "backend_session_libseat", "renderer_pixman", "wayland_frontend", "desktop", "renderer_gl"] }
tehuti-core = { path = "../core" }
tehuti-protocol = { path = "../protocol" }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
font8x8 = "0.3"
chrono = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
tehuti-protocol = { path = "../protocol", features = ["arbitrary"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
