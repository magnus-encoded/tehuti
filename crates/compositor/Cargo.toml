[package]
name = "tehuti"
version = "0.0.0"
description = "Tehuti compositor: the Smithay edge around the core step"
edition.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
libc = "0.2"
evdev = "0.13"
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop", "renderer_gl"] }
tehuti-core = { path = "../core" }
tehuti-protocol = { path = "../protocol" }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
