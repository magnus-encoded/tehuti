[package]
name = "tehuti-protocol"
version = "0.0.0"
description = "Tehuti plugin protocol: events and actions"
edition.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
arbitrary = ["dep:proptest", "dep:proptest-derive"]

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", features = ["preserve_order"] }
proptest = { version = "1", optional = true }
proptest-derive = { version = "0.9", optional = true }
unicode-normalization = "0.1.25"

[dev-dependencies]
proptest = "1"
tehuti-protocol = { path = ".", features = ["arbitrary"] }
