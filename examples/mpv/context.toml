# Pad buttons and spoken phrases for mpv (app id "mpv").
app_id = "mpv"

[buttons]
west = { key = "space" }              # play / pause
dpad_left = { key = "left" }          # seek back (mpv default)
dpad_right = { key = "right" }        # seek forward (mpv default)
dpad_up = { text = "0" }              # volume up (mpv default key)
dpad_down = { text = "9" }            # volume down (mpv default key)
north = { text = "f" }                # fullscreen
select = { key = "escape" }
start = { notify = "mpv: west pause, d-pad seek and volume" }

# Matching ignores case and trailing punctuation, so "Pause." equals "pause".
# There is no fuzzy matching by default: list each likely mishearing as its own phrase.
[speech]
"pause" = { key = "space" }
"paws" = { key = "space" }
"play" = { key = "space" }
"resume" = { key = "space" }
"forward" = { key = "right" }
"skip" = { key = "right" }
"back" = { key = "left" }
"rewind" = { key = "left" }
"louder" = { text = "0" }
"quieter" = { text = "9" }
"quiet her" = { text = "9" }
"fullscreen" = { text = "f" }
"full screen" = { text = "f" }
