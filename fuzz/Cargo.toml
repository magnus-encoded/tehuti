[package]
name = "ibis-commands-fuzz"
license = "MPL-2.0"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ibis-commands = { path = ".." }
serde_json = "1"

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
