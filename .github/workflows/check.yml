name: check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
jobs:
  check:
    if: github.event_name != 'pull_request' || !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl-dev libudev-dev libseat-dev libinput-dev libgbm-dev libdrm-dev libpixman-1-dev python3 python3-pil foot
      - uses: Swatinem/rust-cache@v2
      - run: XDG_RUNTIME_DIR=/tmp scripts/check
      - name: Release smoke
        run: |
          cargo build --locked -p tehuti --bins
          scripts/release-smoke target/debug smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke
          path: smoke/
      - name: Visual regression
        run: scripts/visual-tests target/debug visual-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression
          path: visual-results/
      - name: Install i686 dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev:i386 libwayland-dev:i386 libegl-dev:i386 libudev-dev:i386 libseat-dev:i386 libinput-dev:i386 libgbm-dev:i386 libdrm-dev:i386 libpixman-1-dev:i386
      - name: Check and lint i686 workspace
        run: scripts/check-i686
  pr-body:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Test ADR signoff event handling
        run: node scripts/adr-signoff-events.test.mjs
      - name: Check issue reference or owner-approved ADR
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          has_adr=false
          has_non_adr=false
          while IFS= read -r file; do
            case "$file" in
              docs/adr/*.md|crates/*/docs/adr/*.md) has_adr=true ;;
              *) has_non_adr=true ;;
            esac
          done <<< "$files"

          if [ "$has_adr" = true ]; then
            labels=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER" --jq '[.labels[].name] | index("adr-accepted") != null')
            events=$(gh api --paginate --slurp "repos/$GH_REPO/issues/$PR_NUMBER/events?per_page=100")
            owner_signed=$(node scripts/adr-signoff-events.mjs "$OWNER" <<< "$events" || true)
            [ "$labels" = true ] && [ "$owner_signed" = true ] || {
              echo "ADR changes require the owner-applied adr-accepted label."; exit 1;
            }
          fi

          if [ "$has_non_adr" = true ] || [ "$has_adr" = false ]; then
            grep -qE '^(Closes|Fixes|Resolves) #[0-9]+' "$RUNNER_TEMP/pr-body.md" || {
              echo "PR body must reference the issue it answers: Closes #N"; exit 1;
            }
          fi
          [ "$(wc -w < "$RUNNER_TEMP/pr-body.md")" -le 120 ] || { echo "PR body over 120 words"; exit 1; }
          scripts/prose-lint "$RUNNER_TEMP/pr-body.md"
