name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      action:
        description: Publish a candidate or promote after reviewing its screenshots
        type: choice
        options: [publish, promote]
        default: publish
      tag:
        description: Existing v-prefixed tag to release
        required: true
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'push' || inputs.action == 'publish'
    runs-on: ubuntu-22.04
    # Debian bookworm has i386 libseat and an older glibc than most installs.
    container: debian:bookworm
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686]
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_TARGET_DIR: target
    steps:
      - name: Base tools
        run: apt-get update && apt-get install -y git curl ca-certificates build-essential
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$TAG" =~ ^v[0-9][a-zA-Z0-9._-]*$ ]]
          git describe --exact-match --tags HEAD | grep -Fx "$TAG"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - name: Native dependencies
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          suffix=''
          if [ "$ARCH" = i686 ]; then
            dpkg --add-architecture i386
            suffix=:i386
          fi
          apt-get update
          packages=()
          for package in libxkbcommon-dev libwayland-dev libegl-dev libudev-dev libseat-dev libinput-dev libgbm-dev libdrm-dev libpixman-1-dev; do
            packages+=("$package$suffix")
          done
          apt-get install -y gcc-multilib pkg-config "${packages[@]}"
      - name: Build and package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$ARCH" = i686 ]; then
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
            # The oldest i686 target is the Atom N270.
            export RUSTFLAGS="-C target-cpu=bonnell"
            profile=arakne
          else
            profile=release
          fi
          export TEHUTI_VERSION="${TAG#v}"
          export SOURCE_DATE_EPOCH="$(date -u +%s)"
          cargo build --locked --bins --profile "$profile" -p tehuti --target "$ARCH-unknown-linux-gnu"
          mkdir package
          cp "target/$ARCH-unknown-linux-gnu/$profile/tehuti" package/
          cp -r sidecars dist package/
          find package -type d -name __pycache__ -prune -exec rm -rf {} +
          git rev-parse HEAD > package/VERSION
          tar -czf "tehuti-${TAG#v}-$ARCH-linux.tar.gz" -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: tehuti-*.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x86_64'
        with:
          name: smoke-driver
          path: target/x86_64-unknown-linux-gnu/release/tehuti-drive
  smoke:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: release-x86_64
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: smoke-driver
          path: candidate/bin
      - name: Smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pil foot libxkbcommon0 libwayland-client0 libwayland-server0 libegl1 libudev1 libseat1 libinput10 libgbm1 libdrm2 libpixman-1-0
      - name: Capture release screens
        run: |
          tar -xzf candidate/tehuti-*.tar.gz -C candidate/bin
          chmod +x candidate/bin/tehuti-drive
          scripts/release-smoke candidate/bin smoke
      - name: Upload failed session logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-session-logs
          path: smoke/*/session.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/
  publish:
    needs: [build, smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: smoke
          path: smoke
      - run: |
          sha256sum tehuti-*.tar.gz > SHA256SUMS
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --prerelease --latest=false
          gh release edit "$TAG" --prerelease --latest=false
          gh release upload "$TAG" tehuti-*.tar.gz SHA256SUMS smoke/*.png --clobber
          previous=$(git -C source describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -z "$previous" ] || ! git -C source diff --quiet "$previous" "$TAG" -- sidecars/; then
            notes=$(gh release view "$TAG" --json body -q .body)
            case "$notes" in
              *"sidecar changed"*) ;;
              *) gh release edit "$TAG" --notes "$(printf '%s\n\nsidecar changed\n' "$notes")" ;;
            esac
          fi
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/promote-release "$TAG"
