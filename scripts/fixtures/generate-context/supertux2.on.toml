[speech_matching]
fuzzy = true

[ticker]
enabled = true
speech = "icons"

[ticker.names]
"backspace" = "action"
"delete" = "peek-left"
"down" = "down"
"end" = "peek-down"
"enter" = "jump"
"escape" = "back"
"f1" = "cheat-menu"
"f2" = "debug-menu"
"home" = "peek-up"
"left" = "left"
"p" = "start"
"page_down" = "peek-right"
"right" = "right"
"up" = "up"

[buttons]
# Unmapped role: "cheat-menu" = "f1"
# Unmapped role: "debug-menu" = "f2"
# Unmapped role: "menu-select" = "enter"
# Unmapped role: "peek-down" = "end"
# Unmapped role: "peek-left" = "delete"
# Unmapped role: "peek-right" = "page_down"
# Unmapped role: "peek-up" = "home"
dpad_down = { key = "down", hold = true }
dpad_left = { key = "left", hold = true }
dpad_right = { key = "right", hold = true }
dpad_up = { key = "up", hold = true }
east = { key = "escape", hold = true }
north = { key = "p", hold = true }
